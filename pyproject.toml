[project]
name = "dictate"
version = "0.1.0"
description = "Hotkey-driven local Whisper dictation for macOS (German)"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.0",
    "mlx-lm>=0.19.0",
    "pyobjc-framework-AVFoundation>=12.1",
    "numpy>=2.0",
    "pynput>=1.7.7",
    "rumps>=0.4.0",
]
